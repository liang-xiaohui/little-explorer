<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小小探险家 · 打印套件（每页一张 A4 · 方向键翻页）</title>
<style>
  :root{ --ink:#1a1a1a; --line:#bbb; --cut:#999; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:#e9e9ec; overflow:hidden;
  }

  /* ===== 顶部导航条（屏幕上） ===== */
  #nav{
    position:fixed; top:0; left:0; right:0; height:48px; z-index:50;
    display:flex; align-items:center; gap:10px; padding:0 14px;
    background:#1f2330; color:#fff; font-size:14px; user-select:none;
  }
  #nav .arrow{
    cursor:pointer; border:1px solid #555; background:#2c3142; color:#fff;
    width:34px; height:30px; border-radius:6px; font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #nav .arrow:hover{ background:#3a4055; }
  #nav .arrow:active{ transform:translateY(1px); }
  #nav .pinfo{ min-width:160px; text-align:center; font-weight:600; }
  #nav .spacer{ flex:1; }
  #nav button{
    cursor:pointer; border:none; border-radius:6px; padding:7px 12px;
    font-size:13px; font-weight:600; background:#378ADD; color:#fff;
  }
  #nav button.alt{ background:#534AB7; }
  #nav button:hover{ filter:brightness(1.08); }

  /* ===== 舞台：居中显示当前 A4 页 ===== */
  #stage{
    position:absolute; top:48px; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    overflow:auto; padding:20px;
  }
  #wrap{ transform-origin:top center; }

  /* ===== 单张 A4 页 ===== */
  .sheet{
    width:210mm; height:297mm; padding:8mm; background:#fff;
    box-shadow:0 4px 24px rgba(0,0,0,.28);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .phead{ font-size:15px; font-weight:700; margin:0 0 2mm; border-bottom:2px solid var(--ink); padding-bottom:2mm; }
  .psub{ font-size:10.5px; color:#555; margin:0 0 3mm; line-height:1.5; }
  .pbody{ flex:1; min-height:0; }

  /* 地图：每页 2 张 5×5 */
  .maps{ display:flex; flex-direction:column; gap:5mm; }
  .map{ border:1px dashed var(--cut); padding:2.5mm; background:#fff; }
  .map h3{ margin:0 0 1.5mm; font-size:11px; font-weight:600; }
  .map .grid{ display:grid; grid-template-columns:repeat(5,22mm); grid-template-rows:repeat(5,22mm); }
  .map .cell{ border:0.5px solid var(--line); }

  /* 图例对照条 */
  .overview{ display:grid; grid-template-columns:repeat(4,1fr); gap:2mm 4mm; margin-bottom:3mm; }
  .ov{ display:flex; align-items:center; gap:2mm; border:1px solid var(--line); padding:1.5mm 2mm; }
  .ov svg{ width:15px; height:15px; flex:none; }
  .ov .nm{ font-size:10px; font-weight:600; }

  /* 贴纸通用 */
  .sticker{ border:1px dashed var(--cut); display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; }
  .sticker svg{ width:14mm; height:14mm; }
  .sticker .lbl{ font-size:8.5px; margin-top:1mm; }
  .legend-rows{ display:flex; flex-direction:column; gap:2mm; }
  .legend-row .rh{ font-size:10.5px; font-weight:600; margin-bottom:1mm; }
  .legend-row .rgrid{ display:flex; flex-wrap:wrap; gap:2mm; }
  .legend-row .sticker{ width:24mm; height:24mm; }

  /* 程序动作块：小积木 */
  .prog-wrap{ display:flex; flex-wrap:wrap; gap:2mm; }
  .prog{ width:42mm; height:18mm; border:1px dashed var(--cut); border-radius:3mm; display:flex; align-items:center; gap:1.5mm; padding:0 2mm; background:#fff; }
  .prog svg{ width:11mm; height:11mm; flex:none; }
  .prog .pt{ font-size:10px; font-weight:700; line-height:1; }

  /* 条件贴纸（药丸） */
  .cond-wrap{ display:flex; flex-wrap:wrap; gap:2mm; }
  .cond{ border:1.5px solid #999; border-radius:9mm; padding:2mm 4mm; font-size:11px; font-weight:700; background:#fff; }

  /* === 开口括号结构块：顶部色带 + 左侧虚线作用域 + 底部△结束，不围合，可嵌套 === */
  .grp{ display:flex; flex-direction:column; margin:1.5mm 0; }
  .grp-big{ width:180mm; }     /* 外层用：几乎满 A4 宽，醒目 = 大块 */
  .grp-small{ width:148mm; }   /* 内层/嵌套用：外宽 148mm，能放进 big 的作用域留白区 */
  .ghead{ font-size:13px; font-weight:700; padding:1.5mm 3mm; border:1.5px solid var(--ink); border-bottom:none; border-radius:4mm 4mm 0 0; background:#f3f3f3; }
  .ghead.loop{ background:#378ADD; color:#fff; border-color:#378ADD; }
  .ghead.while{ background:#1D9E75; color:#fff; border-color:#1D9E75; }
  .ghead.func{ background:#534AB7; color:#fff; border-color:#534AB7; }
  .ghead.branch{ background:#D85A30; color:#fff; border-color:#D85A30; }
  .gblank{ display:inline-block; min-width:12mm; border-bottom:1.5px solid currentColor; text-align:center; }
  .gcond{ display:inline-block; min-width:58mm; border-bottom:1.5px dashed currentColor; text-align:center; font-weight:400; font-size:10.5px; }
  .gbody{ margin-left:9mm; padding:2mm 0 2mm 2mm; border-left:3px dashed #bbb; min-height:26mm; color:#999; font-size:9.5px; }
  .grp-small .gbody{ min-height:18mm; }
  .gfoot{ font-size:10.5px; font-weight:700; color:#777; padding:1mm 3mm; }
  .gfoot::before{ content:"△ "; }

  /* 逻辑运算符贴纸（且/或/非） */
  .logic{ background:#2b2b2b; color:#fff; border:1.5px solid #2b2b2b; border-radius:6mm; padding:2mm 4mm; font-size:11px; font-weight:700; }
  /* 调用贴纸 */
  .call{ width:44mm; height:18mm; border:1px solid #534AB7; border-radius:3mm; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:#534AB718; color:#534AB7; }

  /* 变量部件 */
  .varpanel{ border:2px dashed var(--ink); border-radius:8mm; padding:3mm; background:#fff; }
  .varpanel .ptitle{ font-size:12px; font-weight:700; margin-bottom:2mm; }
  .varlines{ display:flex; flex-direction:column; gap:2.5mm; }
  .varline{ display:flex; align-items:center; gap:2mm; font-size:11px; }
  .varline .lab{ font-weight:600; }
  .varline .nm{ min-width:38mm; border-bottom:1px solid var(--ink); text-align:center; }
  .varline .vl{ min-width:24mm; border-bottom:1px solid var(--ink); text-align:center; }
  .vartag{ width:44mm; height:28mm; border:1.5px dashed var(--ink); border-radius:4mm; padding:2mm; background:#fff; display:flex; flex-direction:column; justify-content:center; gap:2mm; font-size:9.5px; font-weight:600; }
  .vartag .ln{ display:flex; align-items:center; gap:1.5mm; }
  .vartag .fill{ flex:1; border-bottom:1px solid var(--ink); min-height:6mm; }

  .hsep{ width:100%; font-size:12px; font-weight:700; margin:2mm 0 1mm; color:#333; }

  /* 打印容器（隐藏，打印时填入全部页） */
  #printAll{ display:none; }

  @media print{
    @page{ size:A4; margin:0; }
    html,body{ background:#fff; overflow:visible; height:auto; }
    #nav, #stage, .screen-tip{ display:none !important; }
    #printAll{ display:block !important; }
    #printAll .sheet{
      width:210mm; height:297mm; padding:8mm; background:#fff; box-shadow:none;
      transform:none !important; page-break-after:always; overflow:hidden;
    }
    #printAll .sheet:last-child{ page-break-after:auto; }
  }
</style>
</head>
<body>

<div id="nav">
  <div class="arrow" id="prev" title="上一页（←）">‹</div>
  <div class="pinfo" id="pinfo">第 1 / 1 页</div>
  <div class="arrow" id="next" title="下一页（→）">›</div>
  <div class="spacer"></div>
  <button id="printCur" class="alt">打印本页</button>
  <button id="printAllBtn">打印全部</button>
</div>

<div class="screen-tip" style="position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#888;z-index:40;">提示：用 ← → 方向键翻页</div>
<div id="stage"><div id="wrap"><div class="sheet" id="sheet"></div></div></div>
<div id="printAll"></div>

<script>
// ============ 图标 ============
const MAP={
  hero:`<circle cx="20" cy="14" r="6" fill="INK"/><rect x="13" y="20" width="14" height="14" rx="4" fill="INK"/><path d="M34 16L40 11V21Z" fill="INK"/>`,
  gem:`<path d="M20 6L32 20L20 34L8 20Z" fill="INK" fill-opacity="0.25"/>`,
  sw:`<rect x="9" y="14" width="22" height="12" rx="6"/><circle cx="26" cy="20" r="5" fill="INK"/>`,
  portal:`<circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="7" fill="INK" fill-opacity="0.3"/><circle cx="20" cy="20" r="2.5" fill="INK"/>`,
  wall:`<rect x="8" y="10" width="24" height="20" rx="2" fill="INK" fill-opacity="0.2"/><path d="M20 10V30M8 20H32"/>`,
  goal:`<path d="M14 8V32" stroke-width="3"/><path d="M14 10L30 15L14 20Z" fill="INK"/>`,
  start:`<circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="4" fill="INK"/>`,
  fwd:`<path d="M20 30V10M14 16L20 10L26 16"/><path d="M14 16L20 10L26 16Z" fill="INK"/>`,
  left:`<path d="M28 14A10 10 0 1 0 28 26M16 20L28 14V26Z" fill="INK"/>`,
  right:`<path d="M12 14A10 10 0 1 1 12 26M24 20L12 14V26Z" fill="INK"/>`,
  collect:`<path d="M20 8L30 20L20 32L10 20Z" fill="INK" fill-opacity="0.25"/>`,
  toggle:`<circle cx="20" cy="20" r="11"/><path d="M14 20h12"/><circle cx="20" cy="20" r="3" fill="INK"/>`,
  jump:`<path d="M20 32V14M14 20L20 14L26 20M10 32h20"/>`
};
function icon(kind,color){
  const c=color||'#1a1a1a';
  return `<svg viewBox="0 0 40 40" fill="none" stroke="${c}" stroke-width="2.5" xmlns="http://www.w3.org/2000/svg">${(MAP[kind]||'').split('INK').join(c)}</svg>`;
}

const ELEMENTS=[
  {k:'hero',nm:'角色',ds:'小探险家',c:'#378ADD'},
  {k:'gem',nm:'宝石',ds:'收集目标',c:'#EF9F27'},
  {k:'sw',nm:'开关',ds:'踩一下切换开/关',c:'#D85A30'},
  {k:'portal',nm:'传送门',ds:'成对，踩上瞬移',c:'#1D9E75'},
  {k:'wall',nm:'墙',ds:'不可通行',c:'#5F5E5A',n:24},
  {k:'goal',nm:'终点',ds:'到达即胜利',c:'#639922'},
  {k:'start',nm:'起点',ds:'角色出发处',c:'#534AB7'},
];
const BLOCKS=[
  {k:'fwd',nm:'前进',short:'前进',c:'#378ADD'},
  {k:'left',nm:'左转',short:'左转',c:'#534AB7'},
  {k:'right',nm:'右转',short:'右转',c:'#534AB7'},
  {k:'collect',nm:'收集宝石',short:'收集',c:'#EF9F27'},
  {k:'toggle',nm:'切换开关',short:'切换',c:'#D85A30'},
  {k:'jump',nm:'跳',short:'跳',c:'#1D9E75'},
];
const CONDS=[
  {nm:'前方有宝石',c:'#EF9F27'},
  {nm:'前方有墙',c:'#5F5E5A'},
  {nm:'开关开着',c:'#D85A30'},
  {nm:'开关关着',c:'#7A4A30'},
  {nm:'脚下是宝石',c:'#EF9F27'},
  {nm:'左侧有墙',c:'#5F5E5A'},
  {nm:'在传送门上',c:'#1D9E75'},
];
const LOGIC=[
  {nm:'且'},{nm:'或'},{nm:'非'}
];

// 开口括号结构块生成器
function grp(size, headClass, headHTML, foot){
  return `<div class="grp grp-${size}"><div class="ghead ${headClass}">${headHTML}</div>`
    + `<div class="gbody">把动作块 / 子结构贴在这里</div>`
    + `<div class="gfoot">结束${foot}</div></div>`;
}

// ============ 各页内容构建器（返回 body 内的 HTML） ============
function mapsBody(count, fromIdx){
  let cellsAll='';
  for(let i=0;i<count;i++){
    const idx=fromIdx+i; let cells='';
    for(let c=0;c<25;c++) cells+=`<div class="cell"></div>`;
    cellsAll+=`<div class="map"><h3>地图 ${idx}　名字：____________</h3><div class="grid">${cells}</div></div>`;
  }
  return `<div class="maps">${cellsAll}</div>`;
}
function legendBody(list){
  let ov='<div class="overview">';
  list.forEach(e=>{ ov+=`<div class="ov">${icon(e.k,e.c)}<span class="nm">${e.nm}</span></div>`; });
  ov+='</div><div class="legend-rows">';
    list.forEach(e=>{
      ov+=`<div class="legend-row"><div class="rh">${e.nm}（${e.ds}）</div><div class="rgrid">`;
      const cnt=e.n||12;
      for(let i=0;i<cnt;i++) ov+=`<div class="sticker">${icon(e.k,e.c)}<span class="lbl">${e.nm}</span></div>`;
      ov+=`</div></div>`;
  });
  return ov+'</div>';
}
function actionsBody(list){
  let s='<div class="prog-wrap">';
  list.forEach(b=>{ for(let i=0;i<14;i++) s+=`<div class="prog" style="border-color:${b.c};background:${b.c}18">${icon(b.k,b.c)}<span class="pt">${b.short}</span></div>`; });
  return s+'</div>';
}
function condsBody(list){
  let s='<div class="cond-wrap">';
  list.forEach(c=>{ for(let i=0;i<12;i++) s+=`<div class="cond" style="border-color:${c.c};color:${c.c}">${c.nm}</div>`; });
  return s+'</div>';
}
function logicBody(){
  let s='<p class="psub" style="margin-top:4mm">逻辑运算符贴纸（且 / 或 / 非，串接条件药丸）：</p><div class="cond-wrap">';
  LOGIC.forEach(l=>{ for(let i=0;i<6;i++) s+=`<div class="logic">${l.nm}</div>`; });
  return s+'</div>';
}
function controlBody(items){ // items: [{size,cls,head,foot,n}]
  let s='<div class="cond-wrap" style="gap:1.5mm">';
  items.forEach(it=>{ for(let i=0;i<it.n;i++) s+=grp(it.size,it.cls,it.head,it.foot); });
  return s+'</div>';
}
function callsBody(n){
  let s='<div class="cond-wrap" style="margin-top:3mm">';
  for(let i=0;i<n;i++) s+=`<div class="call">调用 ____</div>`;
  return s+'</div>';
}
function varsBody(){
  let panel=`<div class="varpanel"><div class="ptitle">变量值面板（铅笔填，运行时改写）</div><div class="varlines">`;
  for(let i=0;i<8;i++) panel+=`<div class="varline"><span class="lab">变量名</span><span class="nm">&nbsp;</span><span class="lab">= 数值</span><span class="vl">&nbsp;</span></div>`;
  panel+=`</div></div><div class="cond-wrap" style="margin-top:4mm">`;
  for(let i=0;i<20;i++) panel+=`<div class="vartag"><div class="ln">变量名<span class="fill">&nbsp;</span></div><div class="ln">数值<span class="fill">&nbsp;</span></div></div>`;
  return panel+'</div>';
}

// ============ 页面清单：每页 = 一张 A4 ============
const PAGES=[
  { t:'空白探险地图（1 / 2）', s:'每张 5×5 格，留白拼出任何场景。打印后可多印。',
    b:mapsBody(2,1) },
  { t:'空白探险地图（2 / 2）', s:'每张 5×5 格，留白拼出任何场景。打印后可多印。',
    b:mapsBody(2,3) },
  { t:'图例贴纸（1 / 2）', s:'每格≈地图一格大小。顶部对照条帮助认图标。可整页多印。',
    b:legendBody(ELEMENTS.slice(0,4)) },
  { t:'图例贴纸（2 / 2）', s:'每格≈地图一格大小。',
    b:legendBody(ELEMENTS.slice(4,7)) },
  { t:'程序动作块（1 / 2）', s:'按顺序排列 = 执行顺序。块小、数量多，方便反复拼。',
    b:actionsBody(BLOCKS.slice(0,3)) },
  { t:'程序动作块（2 / 2）', s:'按顺序排列 = 执行顺序。',
    b:actionsBody(BLOCKS.slice(3,6)) },
  { t:'条件药丸 + 逻辑运算', s:'条件药丸剪下贴到结构块头部「贴条件」虚线处；逻辑运算符（且/或/非）把多个条件串成组合条件。',
    b:condsBody(CONDS) + logicBody() },
  { t:'控制结构·外层①（循环 / 当 / 函数 / 如果）', s:'开口括号：顶部色带 + 左侧虚线作用域 + 底部△结束，不围合、可嵌套。此为「大框」(180mm)。',
    b:controlBody([
      {size:'big',cls:'loop',head:'重复 <span class="gblank">&nbsp;</span> 次',foot:'重复',n:2},
      {size:'big',cls:'while',head:'当 <span class="gcond">贴条件</span> 时 重复',foot:'当',n:1},
      {size:'big',cls:'func',head:'函数 <span class="gblank">&nbsp;</span>',foot:'函数',n:1},
      {size:'big',cls:'branch',head:'如果 <span class="gcond">贴条件</span>',foot:'如果',n:1},
    ]) },
  { t:'控制结构·外层②（如果 / 否则如果 / 否则）', s:'分支链：如果 / 否则如果 / 否则 上下拼成 else-if 链，条件处贴条件药丸。此为「大框」(180mm)。',
    b:controlBody([
      {size:'big',cls:'branch',head:'如果 <span class="gcond">贴条件</span>',foot:'如果',n:1},
      {size:'big',cls:'branch',head:'否则如果 <span class="gcond">贴条件</span>',foot:'否则如果',n:3},
      {size:'big',cls:'branch',head:'否则',foot:'否则',n:1},
    ]) },
  { t:'控制结构·嵌套用（小框）+ 调用', s:'嵌套时把「小框」整条贴进大框作用域（左侧虚线即缩进层级）；调用贴纸多次调用同一函数。',
    b:controlBody([
      {size:'small',cls:'loop',head:'重复 <span class="gblank">&nbsp;</span> 次',foot:'重复',n:2},
      {size:'small',cls:'while',head:'当 <span class="gcond">贴条件</span> 时 重复',foot:'当',n:1},
      {size:'small',cls:'branch',head:'如果 <span class="gcond">贴条件</span>',foot:'如果',n:1},
      {size:'small',cls:'branch',head:'否则如果 <span class="gcond">贴条件</span>',foot:'否则如果',n:1},
    ]) + callsBody(8) },
  { t:'变量部件', s:'变量名贴纸手写名字、贴到结构块旁引用；变量面板用铅笔填值，虚拟运行时改写。',
    b:varsBody() },
];

// ============ 渲染与翻页 ============
const MM=3.7795275591; // px per mm (96dpi)
let idx=0;
const sheet=document.getElementById('sheet');
const wrap=document.getElementById('wrap');
const pinfo=document.getElementById('pinfo');

function render(){
  const p=PAGES[idx];
  sheet.innerHTML=`<div class="phead">${p.t}</div><div class="psub">${p.s}</div><div class="pbody">${p.b}</div>`;
  pinfo.textContent=`第 ${idx+1} / ${PAGES.length} 页 · ${p.t}`;
  fit();
}
function fit(){
  const navH=48, padY=40, padX=40;
  const availW=window.innerWidth-padX;
  const availH=window.innerHeight-navH-padY;
  const s=Math.min(availW/(210*MM), availH/(297*MM), 1.25);
  sheet.style.transform=`scale(${s})`;
  wrap.style.width=(210*MM*s)+'px';
  wrap.style.height=(297*MM*s)+'px';
}
function go(d){ idx=Math.max(0,Math.min(PAGES.length-1, idx+d)); render(); }

document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){ go(-1); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ go(1); e.preventDefault(); }
});
window.addEventListener('resize',fit);

// 打印：本页 / 全部
function doPrint(range){
  const pa=document.getElementById('printAll');
  const list = range==='cur' ? [PAGES[idx]] : PAGES;
  pa.innerHTML=list.map(p=>`<div class="sheet"><div class="phead">${p.t}</div><div class="psub">${p.s}</div><div class="pbody">${p.b}</div></div>`).join('');
  document.body.classList.add('printing');
  window.print();
}
window.onafterprint=()=>{ document.body.classList.remove('printing'); document.getElementById('printAll').innerHTML=''; };
document.getElementById('printCur').onclick=()=>doPrint('cur');
document.getElementById('printAllBtn').onclick=()=>doPrint('all');

render();
</script>
</body>
</html>
